spring.priscriptionservice.liquibase.enabled=false
spring.priscriptionservice.liquibase.change-log=classpath:/database/db.changelog-master.yaml
spring.businessrules.liquibase.change-log=classpath:/database/db.changelog-businessrules.yaml
spring.businessrules.liquibase.enabled=false
spring.h2.console.enabled = true
spring.h2.console.path = /h2
spring.datasource.url = jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle;INIT=CREATE SCHEMA IF NOT EXISTS PBM_NOTIFICATION
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#------------------------------
#Client configuration
#------------------------------
client.tawuniya.url:https://mock.waseel.com/rest/Tawuniya+Apis/1.2
clients.tawuniya.apiKey:apiKey
clients.tawuniya.senderCode:101
clients.tawuniya.receiverCode:102
clients.tawuniya.direction:REQUEST

client.prescription.url:http://localhost:8090

client.EmailServiceClient.url:http://localhost:8080

#----------------------------------------
#Waseel Sms service client configuration
#----------------------------------------
waseelSmsService.url=http://localhost:8097

#-----------------------------------
#Unifonic request details
#-----------------------------------
unifonic.appSid=appSid
unifonic.senderId=senderId
unifonic.appName=appName

#--------------------------
#SSO token details details
#--------------------------
sso.url = url
sso.auth.username:username
sso.auth.password:password
sso.content.type:content-type
sso.body.key:key
sso.body.value:value
