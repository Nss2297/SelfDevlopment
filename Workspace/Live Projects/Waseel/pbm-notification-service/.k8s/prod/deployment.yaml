apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbm-notification-service
  namespace: pbm-prod
  labels:
    app: pbm-notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pbm-notification-service
  template:
    metadata:
      labels:
        app: pbm-notification-service
    spec:
      containers:
        - name: pbm-notification-service-prod-container
          image: me-jeddah-1.ocir.io/ax7dvcawpc84/pbm/prod/pbm-notification-service:latest
          env:
          - name: TZ
            value: Asia/Riyadh
          - name: UNIFONIC_SENDER_ID
            valueFrom:
              secretKeyRef:
                name: pbm-notification-service-secret
                key: UNIFONIC_SENDER_ID
          - name: UNIFONIC_APP_SID
            valueFrom:
              secretKeyRef:
                name: pbm-notification-service-secret
                key: UNIFONIC_APP_SID
          - name: UNIFONIC_APP_NAME
            valueFrom:
              secretKeyRef:
                name: pbm-notification-service-secret
                key: UNIFONIC_APP_NAME
          - name: SSO_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pbm-notification-service-sso-secret
                key: SSO_PASSWORD  
          - name: SSO_REQUEST_BODY_CONTENT_TYPE
            valueFrom:
              secretKeyRef:
                name: pbm-notification-service-sso-secret
                key: SSO_REQUEST_BODY_CONTENT_TYPE     
          - name: SSO_REQUEST_BODY_KEY
            valueFrom:
              secretKeyRef:
                name: pbm-notification-service-sso-secret
                key: SSO_REQUEST_BODY_KEY
          - name: SSO_REQUEST_BODY_VALUE
            valueFrom:
              secretKeyRef:
                name: pbm-notification-service-sso-secret
                key: SSO_REQUEST_BODY_VALUE          
          - name: SSO_URL
            valueFrom:
              secretKeyRef:
                name: pbm-notification-service-sso-secret
                key: SSO_URL            
          - name: SSO_USERNAME
            valueFrom:
              secretKeyRef:
                name: pbm-notification-service-sso-secret
                key: SSO_USERNAME
          - name: PRESCRIPTION_SERVICE_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PRESCRIPTION_SERVICE_USERNAME
          - name: PRESCRIPTION_SERVICE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PRESCRIPTION_SERVICE_PASSWORD
          - name: PBM_BUSINESS_RULES_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PBM_BUSINESS_RULES_USERNAME
          - name: PBM_BUSINESS_RULES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PBM_BUSINESS_RULES_PASSWORD
          - name: TAWUNIYA_API_KEY 
            valueFrom:
              secretKeyRef:
                name: api-keys
                key: TAWUNIYA_API_KEY 
          ports:
          - containerPort: 8080
      imagePullSecrets:
        - name: waseel-docker-registry-cred
