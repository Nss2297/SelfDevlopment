apiVersion: apps/v1
kind: Deployment
metadata:
  name: waseel-sms-service
  namespace: pbm-stg
  labels:
    app: waseel-sms-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waseel-sms-service
  template:
    metadata:
      labels:
        app: waseel-sms-service
    spec:
      containers:
        - name: waseel-sms-service-stg-container
          image: me-jeddah-1.ocir.io/ax7dvcawpc84/pbm/stg/waseel-sms-service:latest
          env:
          - name: TZ
            value: Asia/Riyadh
          - name: HIRA_USERNAME
            valueFrom:
              secretKeyRef:
                name: hira-db-secret
                key: username
          - name: HIRA_PASSWORD
            valueFrom:
              secretKeyRef:
                name: hira-db-secret
                key: password
          - name: SMS_SERVICE_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: sms-service-secret
                key: SMS_SERVICE_CLIENT_ID
          - name: SMS_SERVICE_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: sms-service-secret
                key: SMS_SERVICE_CLIENT_SECRET
          ports:
          - containerPort: 8080
      imagePullSecrets:
        - name: waseel-docker-registry-cred
