apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-consumption-service
  namespace: pbm-prod
  labels:
    app: policy-consumption-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-consumption-service
  template:
    metadata:
      labels:
        app: policy-consumption-service
    spec:
      containers:
        - name: policy-consumption-service-prod-container
          image: me-jeddah-1.ocir.io/ax7dvcawpc84/pbm/prod/policy-consumption-service:latest
          env:
            - name: TZ
              value: Asia/Riyadh
            - name: PBM_BUSINESS_RULES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: PBM_BUSINESS_RULES_USERNAME
            - name: PBM_BUSINESS_RULES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: PBM_BUSINESS_RULES_PASSWORD
            - name: HIRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hira-db-secret
                  key: username
            - name: HIRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hira-db-secret
                  key: password
          ports:
          - containerPort: 8080
      imagePullSecrets:
        - name: waseel-docker-registry-cred
