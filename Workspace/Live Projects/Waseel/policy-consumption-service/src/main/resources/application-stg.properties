#---------------------------------
#Liquibase configuration
#-----------------------------------
spring.liquibase.enabled=true
logging.level.liquibase = INFO
spring.liquibase.change-log=classpath:/database/db.changelog-master.yaml
spring.liquibase.database-change-log-lock-table=DATABASECHANGELOGLOCK
spring.liquibase.database-change-log-table=DATABASECHANGELOG
spring.liquibase.default-schema=PBM_business_rules


#---------------------------------
#DataBase Configuration
#-----------------------------------

spring.datasource.hira.jdbc-url = jdbc:oracle:thin:@adbstage_low?TNS_ADMIN=/opt/wallet/
spring.datasource.hira.username=${HIRA_USERNAME}
spring.datasource.hira.password=${HIRA_PASSWORD}
spring.datasource.hira.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.hira.connectionTimeout=3600000
spring.datasource.hira.idleTimeout=600000
spring.datasource.hira.minimumIdle=1
spring.datasource.hira.maximumPoolSize=1

spring.datasource.businessrules.jdbc-url = jdbc:oracle:thin:@adbstage_low?TNS_ADMIN=/opt/wallet/
spring.datasource.businessrules.username=${PBM_BUSINESS_RULES_USERNAME}
spring.datasource.businessrules.password=${PBM_BUSINESS_RULES_PASSWORD}
spring.datasource.businessrules.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.businessrules.connectionTimeout=3600000
spring.datasource.businessrules.idleTimeout=600000
spring.datasource.businessrules.minimumIdle=1
spring.datasource.businessrules.maximumPoolSize=1

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

