apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service-stg-deployment
  namespace: pbm-stg
  labels:
    app: admin-service-stg-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service-stg-deployment
  template:
    metadata:
      labels:
        app: admin-service-stg-deployment
    spec:
      containers:
        - name: admin-service-stg-container
          image: me-jeddah-1.ocir.io/ax7dvcawpc84/pbm-stg/admin-service:latest
          env:
          - name: TZ
            value: Asia/Riyadh
          - name: MDSS_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MDSS_USERNAME
          - name: MDSS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MDSS_PASSWORD
          - name: PBM_BUSINESS_RULES_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PBM_BUSINESS_RULES_USERNAME
          - name: PBM_BUSINESS_RULES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PBM_BUSINESS_RULES_PASSWORD
          - name: HIRA_USERNAME
            valueFrom:
              secretKeyRef:
                name: hira-db-secret
                key: username
          - name: HIRA_PASSWORD
            valueFrom:
              secretKeyRef:
                name: hira-db-secret
                key: password
          - name: MEDK_FDB_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MEDK_FDB_USERNAME
          - name: MEDK_FDB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MEDK_FDB_PASSWORD
          - name: PRESCRIPTION_SERVICE_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PRESCRIPTION_SERVICE_USERNAME
          - name: PRESCRIPTION_SERVICE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PRESCRIPTION_SERVICE_PASSWORD      
          ports:
          - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTP
            timeoutSeconds: 10
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 20
      imagePullSecrets:
        - name: waseel-docker-registry-cred
