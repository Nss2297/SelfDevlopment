management.security.enabled = false
management.endpoints.web.exposure.include=*
info.app.name=Admin-Service
info.app.java.version=11
info.app.type=Spring Boot-Microservice


pbmPayerApisServiceClient.url:http://pbm-payer-apis-service.pbm-qa:8080/pbm-payer-apis-service
