spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers = true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle10gDialect

#---------------------------------
#Liquibase configuration
#-----------------------------------
spring.liquibase.enabled=true
logging.level.liquibase = INFO
spring.liquibase.change-log=classpath:/database/db.changelog-master.yaml
spring.liquibase.database-change-log-lock-table=DATABASECHANGELOGLOCK
spring.liquibase.database-change-log-table=DATABASECHANGELOG
spring.liquibase.default-schema=MDSS

#---------------------------------
#Actuators  configuration
#-----------------------------------
management.security.enabled = false
management.endpoints.web.exposure.include=*
info.app.name=Admin-Service
info.app.java.version=11
info.app.type=Spring Boot-Microservice


pbmPayerApisServiceClient.url:http://pbm-payer-apis-service.pbm-stg:8080/pbm-payer-apis-service
dssAdminSerivceClient.url:http://dss-admin-service.pbm-stg:8080

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
