spring.datasource.mdss.jdbc-url = jdbc:oracle:thin:@adbstage_low?TNS_ADMIN=/opt/wallet/
spring.datasource.mdss.username=${MDSS_USERNAME}
spring.datasource.mdss.password=${MDSS_PASSWORD}
spring.datasource.mdss.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.mdss.connectionTimeout=3600000
spring.datasource.mdss.idleTimeout=600000
spring.datasource.mdss.minimumIdle=1
spring.datasource.mdss.maximumPoolSize=1

