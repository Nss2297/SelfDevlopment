apiVersion: apps/v1
kind: Deployment
metadata:
  name: dss-service-stg-deployment
  namespace: pbm-stg
  labels:
    app: dss-service-stg-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dss-service-stg-deployment
  template:
    metadata:
      labels:
        app: dss-service-stg-deployment
    spec:
      containers:
        - name: dss-service-stg-container
          image: me-jeddah-1.ocir.io/ax7dvcawpc84/pbm-stg/dss-service:latest
          env:
          - name: TZ
            value: Asia/Riyadh
          - name: REDIS_USERNAME
            valueFrom:
              secretKeyRef:
                name: url-shortener-secrets
                key: REDIS_USERNAME
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: url-shortener-secrets
                key: REDIS_PASSWORD
          - name: MDSS_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MDSS_USERNAME
          - name: MDSS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MDSS_PASSWORD
          - name: HIRA_USERNAME
            valueFrom:
              secretKeyRef:
                name: hira-db-secret
                key: username
          - name: HIRA_PASSWORD
            valueFrom:
              secretKeyRef:
                name: hira-db-secret
                key: password
          - name: MEDK_FDB_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MEDK_FDB_USERNAME
          - name: MEDK_FDB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MEDK_FDB_PASSWORD
          ports:
          - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /dss-service/actuator/health/liveness
              port: 8080
              scheme: HTTP
            timeoutSeconds: 10
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 20
          resources: {}
      imagePullSecrets:
        - name: waseel-docker-registry-cred
