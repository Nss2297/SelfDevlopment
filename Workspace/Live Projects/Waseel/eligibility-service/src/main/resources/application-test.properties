spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:/database/db.changelog-master.yaml

spring.h2.console.enabled = true
spring.h2.console.path = /h2
spring.datasource.url = jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle;INIT=CREATE SCHEMA IF NOT EXISTS PBM_SCHEDULER
