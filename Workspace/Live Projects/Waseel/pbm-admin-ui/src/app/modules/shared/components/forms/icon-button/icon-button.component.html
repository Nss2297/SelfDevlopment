<ng-container *ngIf="color=='primary' && variant=='filled'">
    <button [type]="type" [disabled]="disabled" (click)="onButtonClick($event)"
        [class]="'rounded-[8px] system-transition'+ (iconRtlInvert ? ' rtl-invert ' : '') + colors + paddings + ' ' + cssClass" [title]="tooltip">
        <waseel-icon [icon]="icon" [cssClass]="size == 'small'? 'h-20 w-20 max-w-none':'h-24 w-24 max-w-none'"></waseel-icon>
    </button>
</ng-container>
