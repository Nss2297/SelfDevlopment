<waseel-button *ngIf="mode=='default'" (click)="switchLanguage()" variant="text" icon="left" iconName="language" color="default">{{'language'
    | translate}}</waseel-button>

<waseel-icon-button [tooltip]="'SWITCH-LANGUAGE'|translate" *ngIf="mode=='icon-only'" (click)="switchLanguage()" variant="transparent" color="default"
    icon="language"></waseel-icon-button>
