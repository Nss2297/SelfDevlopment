<div class="p-16 flex items-center border-solid border-b-light-border dark:border-b-neutral-600 border-b-[1px]">
    <h6 class="subtitle-1 dark:text-neutral-25" *ngIf="dialogMode == 'add'">{{'idf.addDrugDiagnosis'|translate}}</h6>
    <h6 class="subtitle-1 dark:text-neutral-25" *ngIf="dialogMode == 'edit'">{{'idf.editDrugDiagnosis'|translate}}</h6>
    <waseel-icon-button class="-mt-12 -mb-12 ltr:ml-auto rtl:mr-auto ltr:-mr-12 rtl:-ml-12 system-transition opacity-[.64] hover:opacity-100 focus:opacity-100 active:opacity-100"
        icon="close" (onClick)="closeDialog()" color="default" variant="transparent"></waseel-icon-button>
</div>
<div class="p-16 pb-0">
    <waseel-select-with-search [label]="'customization.serviceCode' | translate" [options]="[{key: 'test', value: 'test'}]"
        [placeholder]="'SELECT' | translate"></waseel-select-with-search>
    <waseel-select-with-search [label]="'customization.icdCode' | translate" [options]="[{key: 'test', value: 'test'}]"
        [placeholder]="'SELECT' | translate"></waseel-select-with-search>
</div>
<div class="py-12 px-16 flex justify-end border-solid border-t-light-border dark:border-t-neutral-600 border-t-[1px]">
    <waseel-button variant="tonal" class="ltr:mr-8 rtl:ml-8 ltr:last:mr-0 rtl:last:ml-0" (onClick)="closeDialog()">{{'CANCEL'|translate}}</waseel-button>
    <waseel-button class="ltr:mr-8 rtl:ml-8 ltr:last:mr-0 rtl:last:ml-0">{{'SAVE'|translate}}</waseel-button>
</div>
