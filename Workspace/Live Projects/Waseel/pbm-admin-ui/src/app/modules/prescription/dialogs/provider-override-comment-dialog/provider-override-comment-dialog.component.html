<div class="p-16">
    <waseel-textbox [maxLength]="1000" #commentTextBox placeholder="{{'PROVIDE-REASON-FOR-OVERRIDE-OPTIONAL'|translate}}" [label]="'PROVIDER-OVERRIDE-COMMENT-QUESTION' | translate"
        [multiline]="true" [rows]="4" [(ngModel)]="overRiding" [error]="commentboxError? 'Comment is required' :''"></waseel-textbox>
    <div class="row small-gutter">
        <div class="col-6">
            <waseel-button variant="tonal" class="w-full" cssClass="w-full" (onClick)="closeDialog()">{{'CANCEL'|translate}}</waseel-button>
        </div>
        <div class="col-6">
            <waseel-button class="w-full" cssClass="w-full" (onClick)="saveChanges()">{{'OVERRIDE-DECISION'|translate}}</waseel-button>
        </div>
    </div>
</div>
