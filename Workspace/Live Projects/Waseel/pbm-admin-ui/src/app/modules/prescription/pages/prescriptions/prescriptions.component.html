<app-base-page headerTitle="{{'prescription.prescriptions' | translate}}">
    <div page-main-section class="pb-24 pt-88 system-transition main-content">
        <div class="bg-white dark:bg-neutral-800 shadow-1 rounded-[8px]">
            <list-view [list]="data" [prototype]="listPrototype" [extraClasses]="getExtraClassesForListView()" [translateData]="[':4']" [isLoading]="listIsLoading"
                [showEditButton]="showEditButton" [showDeleteButton]="showDeleteButton" [showCommentButton]="false" [showMoreActionsMenu]="showMoreActionsMenu"
                [moreActionsList]="moreActionsList" (onMoreActionMenu)="onMoreActionsMenuItemClick($event.action, $event.id);"
                (onItemClick)="openViewDrugDiagnosisDialog($event.id)" (onNext)="dataControl.pageNumber = $event.pageNumber; fetchData()"
                (onPrevious)="dataControl.pageNumber = $event.pageNumber; fetchData()"
                (onSizeChange)="dataControl.recordSize = $event.pageSize; dataControl.pageNumber=0; fetchData()"
                [customCells]="{memberName:memberNameCustomView, providerName:providerNameCustomView}"></list-view>
            <ng-template #memberNameCustomView let-row="row">
                {{row.idNumber}}{{" - "}}{{row.memberName}}
            </ng-template>
            <ng-template #providerNameCustomView let-row="row">
                {{row.providerName}}{{" - "}}{{row.providerId}}
            </ng-template>

        </div>
    </div>
    <ng-container header-actions>
        <waseel-button variant="tonal" icon="left" class="ltr:mr-8 rtl:ml-8 ltr:last:mr-0 rtl:last:ml-0" iconName="filter" (onClick)="isFilterDrawerOpen=true">{{'FILTER' |
            translate}}</waseel-button>
        <waseel-button icon="left" class="ltr:mr-8 rtl:ml-8 ltr:last:mr-0 rtl:last:ml-0" iconName="add" routerLink="/prescription/add"
            *ifHasAnyAllowedAuthority="['PBM_PRESCRIPTION', 'PRESCRIPTION_SUBMISSION', 'NEW_PRESCRIPTION','FOLLOW_UP_PRESCRIPTION']">{{'ADD-NEW'
            |
            translate}}</waseel-button>
    </ng-container>
</app-base-page>


<form [formGroup]="filterForm" (submit)="applyFilter()">
    <waseel-drawer title="FILTER" [(isOpen)]="isFilterDrawerOpen">
        <ng-container body-block>
            <waseel-alert *ngIf="errorCode.length > 0" class="mt-16 mb-16 block">
                {{ errorCode | translate }}
            </waseel-alert>
            <waseel-textbox name="referenceNo" formControlName="referenceNo" [(ngModel)]="refNo " [label]="'prescription.referenceNo' | translate"
                [placeholder]="'prescription.referenceNo' | translate"></waseel-textbox>
            <waseel-textbox type="date" name="startdate" formControlName="startdate" [label]="'prescription.startdate' | translate" [placeholder]="'mm/dd/yyyy'"></waseel-textbox>
            <waseel-textbox type="date" name="enddate" formControlName="enddate" [label]="'prescription.enddate' | translate" [placeholder]="'mm/dd/yyyy'"></waseel-textbox>
            <waseel-textbox name="memberName" formControlName="memberName" [(ngModel)]="memberN" [label]="'prescription.member' | translate"
                [placeholder]="'prescription.member' | translate" [error]="isMemberIdError? memberIdErrorMsg :''"></waseel-textbox>

            <waseel-select name="status" formControlName="status" [label]="'prescription.status' | translate" [options]="(prescriptionLovService.statusList$ | async) || []"
                [placeholder]="'SELECT' | translate"></waseel-select>

            <waseel-select *ifHasAnyAllowedAuthority="['PBM_PRESCRIPTION', 'PRESCRIPTION_SUBMISSION', 'NEW_PRESCRIPTION','FOLLOW_UP_PRESCRIPTION']" name="insurance"
                formControlName="insurance" [label]="'prescription.insurance' | translate" [options]="insurance"></waseel-select>
            <div *ifHasAnyAllowedAuthority="['VIEW_PRESCRIPTION']" class="col">
                <div class="group">
                    <waseel-textbox [placeholder]="'prescription.provider'|translate" [title]="selectedProviderName?selectedProviderName:''" formControlName="provider"
                        [label]="'prescription.provider' | translate" (onSearch)="getProviders($event)"></waseel-textbox>
                    <div class="relative none group-focus-within:block" *ngIf="((prescriptionLovService.providersList$ | async)?.length || 0) > 0">
                        <div
                            class="absolute hidden max-h-[300px] overflow-auto group-focus-within:block rounded-[8px] shadow-4 bg-white dark:bg-neutral-800 left-0 top-[calc(100%-16px)] right-0 z-[5]">
                            <ul class="py-8">
                                <li class="border-b border-b-border last:border-0" *ngFor="let provider of ((prescriptionLovService.providersList$ | async) || []); let i = index">
                                    <button type="button"
                                        class="w-full text-start px-16 block py-10 body-2 text-text dark:text-neutral-25 system-transition hover:bg-neutral-50 dark:hover:bg-neutral-700 focus:bg-neutral-50 dark:focus:bg-neutral-700 active:bg-neutral-50 dark:active:bg-neutral-700"
                                        (click)="selectItem(provider)">
                                        {{provider.providerName}}
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- <waseel-select name="provider" formControlName="provider" [label]="'prescription.provider' | translate" [options]="providers"></waseel-select> -->

        </ng-container>
        <div class="flex justify-end py-12 px-16 items-center border-t border-t-light-border dark:border-t-neutral-600 flex-shrink-0" footer-block>
            <waseel-button variant="tonal" type="button" class="ltr:mr-8 rtl:ml-8 ltr:last:mr-0 rtl:last:ml-0" (onClick)="resetFilter()">{{'RESET' |
                translate}}</waseel-button>
            <waseel-button class="ltr:mr-8 rtl:ml-8 ltr:last:mr-0 rtl:last:ml-0" (onClick)="applyFilter()">{{'FILTER' | translate}}</waseel-button>
        </div>
    </waseel-drawer>
</form>

<waseel-dialog (onClose)="closeDispensePrescriptionDialog" *ngIf="dispensePrescriptionDialogOpen" size="lg" [internalScroll]="true">
    <dispense-dialog (onClose)="closeDispensePrescriptionDialog()" [ePrescriptionReferenceNumber]="ePrescriptionReferenceNumber" [action]="action"></dispense-dialog>
</waseel-dialog>
