<div class="p-16 flex items-center border-solid border-b-light-border dark:border-b-neutral-600 border-b-[1px]">
    <h6 class="subtitle-1 text-text dark:text-neutral-25">{{'ADD-DRUG'|translate}}</h6>
    <waseel-icon-button class="-mt-12 -mb-12 ltr:ml-auto rtl:mr-auto ltr:-mr-12 rtl:-ml-12 system-transition opacity-[.64] hover:opacity-100 focus:opacity-100 active:opacity-100"
        icon="close" (onClick)="closeDialog()" color="default" variant="transparent"></waseel-icon-button>
</div>
<div class="p-16 pb-0">
    <div class="group">
        <waseel-textbox [label]="'prescription.drug'|translate" [error]="drugValidationMsg" [formControl] ="searchFormControl" endAdornment="search" [placeholder]="'SEARCH-PLACEHOLDER'|translate" (onSearch)="getDrugsForExclusion($event)"></waseel-textbox>
        <div class="relative hidden group-focus-within:block" *ngIf="((prescriptionLOVs.drugsList$ | async)?.content || []).length > 0">
            <div
                class="absolute hidden max-h-[300px] overflow-auto group-focus-within:block rounded-[8px] shadow-4 bg-white dark:bg-neutral-800 left-0 top-[calc(100%-16px)] right-0 z-[5]">
                <ul class="py-8">
                    <li *ngFor="let drug of ((prescriptionLOVs.drugsList$ | async)?.content || [])">
                        <button
                            class="w-full text-start px-16 block py-10 body-2 text-text dark:text-neutral-25 system-transition hover:bg-neutral-50 dark:hover:bg-neutral-700 focus:bg-neutral-50 dark:focus:bg-neutral-700 active:bg-neutral-50 dark:active:bg-neutral-700"  (click)="selectDrug(drug)">
                            {{drug.sfdaCode}} {{drug.scientificName}}
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
<div class="py-12 px-16 flex justify-end border-solid border-t-light-border dark:border-t-neutral-600 border-t-[1px]">
    <waseel-button variant="tonal" class="ltr:mr-8 rtl:ml-8 ltr:last:mr-0 rtl:last:ml-0" type="button" (click)="closeDialog()">{{'CANCEL'|translate}}</waseel-button>
    <waseel-button (click)="saveDrugData()">{{'SAVE'|translate}}</waseel-button>
</div>
