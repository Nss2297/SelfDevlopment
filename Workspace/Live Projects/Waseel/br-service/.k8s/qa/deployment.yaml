apiVersion: apps/v1
kind: Deployment
metadata:
  name: br-service
  namespace: pbm-qa
  labels:
    app: br-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: br-service
  template:
    metadata:
      labels:
        app: br-service
    spec:
      containers:
        - name: br-service-qa-container
          image: me-jeddah-1.ocir.io/ax7dvcawpc84/pbm/qa/br-service:latest
          env:
          - name: TZ
            value: Asia/Riyadh
          ports:
          - containerPort: 8080
      imagePullSecrets:
        - name: waseel-docker-registry-cred
