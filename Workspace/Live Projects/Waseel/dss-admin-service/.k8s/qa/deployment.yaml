apiVersion: apps/v1
kind: Deployment
metadata:
  name: dss-admin-service
  namespace: pbm-qa
  labels:
    app: dss-admin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dss-admin-service
  template:
    metadata:
      labels:
        app: dss-admin-service
    spec:
      containers:
        - name: dss-admin-service-qa-container
          image: me-jeddah-1.ocir.io/ax7dvcawpc84/pbm/qa/dss-admin-service:latest
          env:
          - name: TZ
            value: Asia/Riyadh
          ports:
          - containerPort: 8080
      imagePullSecrets:
        - name: waseel-docker-registry-cred
