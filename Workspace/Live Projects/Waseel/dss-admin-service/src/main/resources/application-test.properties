spring.h2.console.enabled = true
spring.h2.console.path = /h2
spring.datasource.url = jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle;INIT=CREATE SCHEMA IF NOT EXISTS DSS_ADMIN_SERVICE
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:/database/db.changelog-master.yaml

pbmPayerApisServiceClient.url:http://pbm-payer-apis-service.pbm-qa:8080/pbm-payer-apis-service