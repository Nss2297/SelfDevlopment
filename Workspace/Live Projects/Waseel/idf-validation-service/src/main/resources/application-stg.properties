#Liquibase configuration
#-----------------------------------
spring.liquibase.enabled=true
logging.level.liquibase = INFO
spring.liquibase.change-log=classpath:/database/db.changelog-master.yaml
spring.liquibase.database-change-log-lock-table=DATABASECHANGELOGLOCK
spring.liquibase.database-change-log-table=DATABASECHANGELOG
spring.liquibase.default-schema=MDSS

#DataBase Configuration
spring.datasource.url = jdbc:oracle:thin:@adbstage_low?TNS_ADMIN=/opt/wallet/
spring.datasource.username=${MDSS_USERNAME}
spring.datasource.password=${MDSS_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle10gDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers = true
spring.datasource.hikari.connectionTimeout=3600000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.minimumIdle=1
spring.datasource.hikari.maximumPoolSize=3


