apiVersion: apps/v1
kind: Deployment
metadata:
  name: drug-exclusion-validation-service
  namespace: pbm-qa
  labels:
    app: drug-exclusion-validation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drug-exclusion-validation-service
  template:
    metadata:
      labels:
        app: drug-exclusion-validation-service
    spec:
      containers:
        - name: drug-exclusion-validation-service-qa-container
          image: me-jeddah-1.ocir.io/ax7dvcawpc84/pbm/qa/drug-exclusion-validation-service:latest
          env:
          - name: TZ
            value: Asia/Riyadh
          ports:
          - containerPort: 8080
      imagePullSecrets:
        - name: waseel-docker-registry-cred
