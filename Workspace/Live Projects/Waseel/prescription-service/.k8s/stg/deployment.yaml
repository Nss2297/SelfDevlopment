apiVersion: apps/v1
kind: Deployment
metadata:
  name: prescription-service-stg-deployment
  namespace: pbm-stg
  labels:
    app: prescription-service-stg-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prescription-service-stg-deployment
  template:
    metadata:
      labels:
        app: prescription-service-stg-deployment
    spec:
      containers:
        - name: prescription-service-stg-container
          image: me-jeddah-1.ocir.io/ax7dvcawpc84/pbm-stg/prescription-service:latest
          env:
          - name: TZ
            value: Asia/Riyadh
          - name: MDSS_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MDSS_USERNAME
          - name: MDSS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MDSS_PASSWORD
          - name: HIRA_USERNAME
            valueFrom:
              secretKeyRef:
                name: hira-db-secret
                key: username
          - name: HIRA_PASSWORD
            valueFrom:
              secretKeyRef:
                name: hira-db-secret
                key: password
          - name: PRESCRIPTION_SERVICE_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PRESCRIPTION_SERVICE_USERNAME
          - name: PRESCRIPTION_SERVICE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PRESCRIPTION_SERVICE_PASSWORD
          - name: PBM_BUSINESS_RULES_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PBM_BUSINESS_RULES_USERNAME
          - name: PBM_BUSINESS_RULES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: PBM_BUSINESS_RULES_PASSWORD
          - name: PBM_OAUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: prescription-service-secrets
                key: PBM_OAUTH_CLIENT_ID
          - name: PBM_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: prescription-service-secrets
                key: PBM_OAUTH_CLIENT_SECRET
          ports:
          - containerPort: 8080
      imagePullSecrets:
        - name: waseel-docker-registry-cred
