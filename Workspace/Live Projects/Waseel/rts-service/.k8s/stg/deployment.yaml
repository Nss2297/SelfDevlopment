apiVersion: apps/v1
kind: Deployment
metadata:
  name: rts-service-stg-deployment
  namespace: pbm-stg
  labels:
    app: rts-service-stg-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rts-service-stg-deployment
  template:
    metadata:
      labels:
        app: rts-service-stg-deployment
    spec:
      nodeSelector:
        environment: pbm-stg
      containers:
        - name: rts-service-stg-container
          image: me-jeddah-1.ocir.io/ax7dvcawpc84/pbm-stg/rts-service:latest
          env:
          - name: TZ
            value: Asia/Riyadh
          - name: MDSS_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MDSS_USERNAME
          - name: MDSS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: MDSS_PASSWORD
          - name: HIRA_USERNAME
            valueFrom:
              secretKeyRef:
                name: hira-db-secret
                key: username
          - name: HIRA_PASSWORD
            valueFrom:
              secretKeyRef:
                name: hira-db-secret
                key: password
          ports:
          - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTP
            timeoutSeconds: 10
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 20
      imagePullSecrets:
        - name: waseel-docker-registry-cred
