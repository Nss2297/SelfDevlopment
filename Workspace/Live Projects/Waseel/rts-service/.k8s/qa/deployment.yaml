apiVersion: apps/v1
kind: Deployment
metadata:
  name: rts-service-qa-deployment
  namespace: pbm-qa
  labels:
    app: rts-service-qa-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rts-service-qa-deployment
  template:
    metadata:
      labels:
        app: rts-service-qa-deployment
    spec:
      containers:
        - name: rts-service-qa-container
          image: me-jeddah-1.ocir.io/ax7dvcawpc84/pbm-qa/rts-service:latest
          env:
          - name: TZ
            value: Asia/Riyadh
          ports:
          - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /rts-service/actuator/health/liveness
              port: 8080
              scheme: HTTP
            timeoutSeconds: 10
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 20
      imagePullSecrets:
        - name: waseel-docker-registry-cred
